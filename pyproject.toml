[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesage"
version = "0.1.0"
description = "A terminal AI coding agent that runs on free/local LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
codesage = "codesage.cli:main"

[tool.setuptools]
packages = ["codesage"]
